# Postgres for the S7 prototype. Host port 54327, so it never clashes with a local 5432 or with
# spike S8's container.
name: askdare-s7
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: askdare
      POSTGRES_PASSWORD: askdare
      POSTGRES_DB: askdare
    ports:
      - '127.0.0.1:54327:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U askdare']
      interval: 1s
      timeout: 3s
      retries: 30
