# Postgres with pgvector for spike S8. Host port 54328, so it can run next to S7's container.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: askdare-s8-pgvector
    environment:
      POSTGRES_USER: s8
      POSTGRES_PASSWORD: s8
      POSTGRES_DB: s8
    ports:
      - "127.0.0.1:54328:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s8"]
      interval: 2s
      retries: 20
