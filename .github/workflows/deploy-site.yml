# Deploys the website (site/) to Vercel from CI: GitHub Actions builds it and uploads the build
# (`vercel build` + `vercel deploy --prebuilt`), so Vercel needs no access to the repository. It
# runs once the repository variable VERCEL_DEPLOY is true; the job's environment "vercel", which
# only main may use, holds the secret VERCEL_TOKEN. The site's own variables (OpenAI key,
# CHAT_SECRET, …) live in the Vercel project. See site/README.md.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - packages/**
      - docs/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  VERCEL: vercel@65.4.0
  VERCEL_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    if: github.repository == 'boldare/askdare' && vars.VERCEL_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: vercel
      url: ${{ steps.deploy.outputs.url }}
    env:
      # The Vercel team and project. Not secrets: Vercel keeps them in .vercel/project.json.
      VERCEL_ORG_ID: team_aLBb5BIjuYNAmQ1C8YpACUDZ
      VERCEL_PROJECT_ID: prj_7z0rz9ci2oamQk0p3FWI0PAfIXCl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The project's settings (Root Directory: site) and production variables.
      - run: npx -y "$VERCEL" pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Installs and builds with site/vercel.json: the packages first, then next build.
      - run: npx -y "$VERCEL" build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        run: echo "url=$(npx -y "$VERCEL" deploy --prebuilt --prod --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # The docs chat's store follows docs/, its citations linking to the pages just deployed.
      # Only changed files upload, so a push without docs changes costs one listing. It needs the
      # secret OPENAI_API_KEY in this environment (from the project with a spend limit), and the
      # store's ID from the Vercel project: without one, kb sync would create a new store.
      - name: Sync the docs chat
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_URL: https://askdare.vercel.app
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "No OPENAI_API_KEY secret in the vercel environment: the docs chat isn't synced."
            exit 0
          fi
          DOCS_VECTOR_STORE_ID="$(grep '^DOCS_VECTOR_STORE_ID=' .vercel/.env.production.local | cut -d= -f2- | tr -d '"')"
          case "$DOCS_VECTOR_STORE_ID" in
            vs_*) ;;
            *) echo "::error::DOCS_VECTOR_STORE_ID isn't set in the Vercel project."; exit 1 ;;
          esac
          DOCS_VECTOR_STORE_ID="$DOCS_VECTOR_STORE_ID" node site/scripts/docs-kb.mjs
