name: Canary

# Nightly: tomorrow's Next.js and today's OpenAI SDK, before our users meet them (ADR-0006).
# A failure here is a heads-up, not a broken main: open an issue, pin, or adapt.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: next@canary, openai@latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Upgrade to the canaries
        run: |
          # Canary releases are hours old; the usual one-day minimum release age would refuse them.
          sed -i 's/^minimumReleaseAge: .*/minimumReleaseAge: 0/' pnpm-workspace.yaml
          pnpm --recursive update next@canary
          pnpm --filter @boldare/chatdock update openai@latest
          pnpm list --recursive --depth 0 next openai
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-traces
          path: test-results/
          retention-days: 7
