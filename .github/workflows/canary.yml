name: Canary

# Nightly: tomorrow's Next.js and today's OpenAI SDK, before our users meet them (ADR-0006).
# A failure here is a heads-up, not a broken main: open an issue, pin, or adapt.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: next@canary, openai@latest
    runs-on: ubuntu-latest
    # @boldare/askdare-postgres's tests run against it in `pnpm check` (as in ci.yml).
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: askdare
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: askdare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askdare"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ASKDARE_POSTGRES_TEST_URL: postgres://askdare@localhost:5432/askdare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Upgrade to the canaries
        run: |
          # Canary releases are hours old; the usual one-day minimum release age would refuse them.
          sed -i 's/^minimumReleaseAge: .*/minimumReleaseAge: 0/' pnpm-workspace.yaml
          pnpm --recursive update next@canary
          pnpm --filter @boldare/askdare update openai@latest
          pnpm list --recursive --depth 0 next openai
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e
      # The same subset of specs as ci.yml in the other engines; the site is built by now.
      - run: pnpm exec playwright test --project firefox --project webkit
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-traces
          path: test-results/
          retention-days: 7

  packs:
    # The adopter path, as released: the packed packages in a fresh create-next-app, init, doctor,
    # Turbopack and webpack builds, and a chat against the mock (scripts/verify-packs.mjs).
    name: packed packages in a fresh app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:packs
