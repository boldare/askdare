# Stages releases through npm trusted publishing (OIDC); no npm token is stored anywhere. The
# trusted publisher only allows `npm stage publish`, so nothing goes live until a maintainer
# approves the staged version with 2FA on npmjs.com (Staged Packages) or `npm stage approve`.
# It runs once the repository variable NPM_TRUSTED_PUBLISHING is true.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    if: github.repository == 'boldare/askdare' && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    # The trusted publisher on npm names this environment, which only main may use.
    environment: npm
    permissions:
      contents: write # version commits and tags
      pull-requests: write # "Version packages" pull request
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the previous commit's versions tell what changed
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Nothing is versioned or published unless the whole check passes on this commit.
      - run: pnpm check
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm changeset version
          # Stage, don't publish: approval stays with a person (scripts/stage-release.mjs).
          publish: node scripts/stage-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
