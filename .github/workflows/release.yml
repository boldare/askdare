# Releases through npm trusted publishing (OIDC); no npm token is stored anywhere. It runs once
# the repository variable NPM_TRUSTED_PUBLISHING is true. NPM_RELEASE_MODE picks stage (the
# default: a maintainer approves each version with 2FA on npmjs.com) or publish (live once the
# "Version packages" pull request merges; the trusted publisher must allow npm publish).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    if: github.repository == 'boldare/askdare' && vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    # The trusted publisher on npm names this environment, which only main may use.
    environment: npm
    permissions:
      contents: write # version commits and tags
      pull-requests: write # "Version packages" pull request
      id-token: write # npm trusted publishing + provenance
    steps:
      # A token of the repository's GitHub App, so the "Version packages" pull request runs CI:
      # one pushed and opened with GITHUB_TOKEN triggers no workflows. The app's client ID is the
      # variable RELEASE_APP_CLIENT_ID and its private key the secret RELEASE_APP_PRIVATE_KEY, both
      # in the npm environment. Until they are set, GITHUB_TOKEN does the job without CI.
      - id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the previous commit's versions tell what changed
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Nothing is versioned or published unless the whole check passes on this commit.
      - run: pnpm check
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # changeset version, then the lockfile, since the starter's range moves with the version.
          # The action runs it without a shell, hence a package script.
          version-script: pnpm version-packages
          publish-script: node scripts/release-packages.mjs
          # v2 takes a token other than the workflow's only here, and fails when GITHUB_TOKEN differs.
          github-token: ${{ steps.app-token.outputs.token || github.token }}
        env:
          NPM_RELEASE_MODE: ${{ vars.NPM_RELEASE_MODE }}
