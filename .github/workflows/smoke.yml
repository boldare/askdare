name: Live smoke

# Daily: one text turn, one tool call, file search and an image against the real OpenAI API, so
# a retired model or a changed API shows up before a user reports it (ADR-0006).
# Needs a key from a dedicated OpenAI project with a hard spend limit (docs/live-testing.md):
#   secret SMOKE_OPENAI_API_KEY; variables SMOKE_MODEL, and optionally SMOKE_VECTOR_STORE_ID
#   and SMOKE_TRANSCRIBE_MODEL.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: real OpenAI API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.SMOKE_OPENAI_API_KEY }}
      SMOKE_MODEL: ${{ vars.SMOKE_MODEL }}
      SMOKE_VECTOR_STORE_ID: ${{ vars.SMOKE_VECTOR_STORE_ID }}
      SMOKE_TRANSCRIBE_MODEL: ${{ vars.SMOKE_TRANSCRIBE_MODEL }}
    steps:
      - name: Skip without a key
        id: key
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$SMOKE_MODEL" ]; then
            echo "SMOKE_OPENAI_API_KEY or SMOKE_MODEL is not set; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.key.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.key.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.key.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.key.outputs.ready == 'true'
        run: pnpm smoke
