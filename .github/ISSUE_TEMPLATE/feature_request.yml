name: Feature request
description: Something askdare should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: An API, an option or a behavior. The public API stays small on purpose (ADR-0006), so say why config, CSS or a tool can't do it today.
  - type: textarea
    id: else
    attributes:
      label: Alternatives you tried
