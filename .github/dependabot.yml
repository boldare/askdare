# Dependency updates, once a week (ADR-0007). Built into GitHub, so no app needs installing.
# The pnpm workspace is read from the root: packages/, examples/ and site/ update together; spikes/
# is outside it. Our own packages move with Changesets, not here.
#
# A pull request that changes a published package's dependencies (not devDependencies) needs a
# changeset before it merges: users get that dependency with the next release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Warsaw
    # Lets a bad release be pulled before it reaches us.
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    ignore:
      - dependency-name: "@boldare/askdare"
      - dependency-name: "@boldare/askdare-upstash"
    groups:
      # openai ships type-breaking minors; review them together once a week (ADR-0002).
      openai:
        patterns: ["openai"]
      # Non-major dev tooling updates are low risk.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Warsaw
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
    # The workflows pin actions to commits; Dependabot moves the commit and its version comment.
    groups:
      actions:
        patterns: ["*"]
